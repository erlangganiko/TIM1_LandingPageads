<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moemtaz</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="site-logo">
        <img src="img/icon/Apple grey.png" />

        <span>Moemtaz Logo</span>
      </div>
      <nav class="promo-nav">
        <a href="#" class="promo-link" id="promoButton">Promo</a>
      </nav>
    </header>
    <main>
      <div class="hero container">
        <div class="text-content">
          <h1>The Essence of Beauty</h1>
          <p>
            Discover our range of luxurious cosmetics and experience the true
            essence of beauty. Our products are crafted to enhance your natural
            radiance and elevate your beauty routine.
          </p>
        </div>
        <div class="video-content">
          <video
            src="assets/video/contoh2.mp4"
            autoplay
            loop
            muted
            playsinline
          ></video>
        </div>
      </div>
    </main>
  </body>
</html>
