<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moemtaz Group Landing Page</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <img
          src="assets/images/China's Smile.png"
          alt="Moemtaz Logo"
          class="logo"
        />
        <h1><span>Moemtaz</span> Group.</h1>
      </nav>
    </header>

    <main class="landing">
      <section class="left">
        <img src="assets/images/Author Smile.png" alt="Produk Skincare" />
        <h1>
          Akhirnya kamu akan<br />
          punya <strong>BRAND SKINCARE</strong> mu sendiri
        </h1>
      </section>
      <section class="right">
        <video controls poster="assets/images/" autoplay muted loop playsinline>
          <source src="assets/video/tim1.1.mp4" type="video/mp4" />
          Browser kamu tidak mendukung video.
        </video>
        <!-- WhatsApp Sticky Button -->
        <div class="wa-sticky">
          <a href="https://wa.me/628221202285" target="_blank">
            <img src="assets/images/Author Smile.png" alt="WhatsApp" />
          </a>
        </div>
      </section>
    </main>

    <h2>Galeri Klien</h2>
    <div class="slider-container">
      <div class="slider-track" id="slider">
        <!-- Ulangi isi untuk efek loop -->
        <div class="card">
          <img src="assets/images/Author Smile.png" alt="Foto 1" />
        </div>
        <div class="card">
          <img src="assets/images/China's Smile.png" alt="Foto 2" />
        </div>
        <div class="card">
          <img src="assets/images/Author Smile.png" alt="Foto 3" />
        </div>
        <div class="card">
          <img src="assets/images/China's Smile.png"Foto 4" />
        </div>
        <div class="card">
          <img src="assets/images/Author Smile.png" alt="Foto 5" />
        </div>
        <!-- Duplikasi untuk loop -->
        <div class="card">
          <img src="assets/images/Author Smile.png" alt="Foto 1" />
        </div>
        <div class="card">
          <img src="assets/images/China's Smile.png" alt="Foto 2" />
        </div>
        <div class="card">
          <img src="assets/images/Author Smile.png" alt="Foto 3" />
        </div>
        <div class="card">
          <img src="assets/images/China's Smile.png"Foto 4" />
        </div>
        <div class="card">
          <img src="assets/images/Author Smile.png" alt="Foto 5" />
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
