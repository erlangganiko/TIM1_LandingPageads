<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moemtaz</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/feather-icons"></script>
  </head>
  <body>
    <header>
      <div class="site-logo">
        <img src="img/icon/Apple grey.png" />
        <span>Moemtaz Logo</span>
      </div>
      <nav class="promo-nav">
        <a href="#" class="promo-link" id="promoButton">Promo</a>
      </nav>
    </header>
    <section class="hero-grid">
      <!-- Kiri: Gambar + Teks -->
      <div class="image-container">
        <img
          src="assets/img/cnth1.jpg"
          alt="Produk Skincare"
          class="product-image"
        />
        <div class="text-overlay">
          <h1>
            Akhirnya kamu akan <br />
            punya <span>BRAND SKINCARE</span><br />
            mu sendiri
          </h1>
        </div>
      </div>

      <!-- Kanan: Video -->
      <div class="video-container">
        <video autoplay muted loop playsinline class="lab-video">
          <source src="assets/video/contoh2.mp4" type="video/mp4" />
          Browser tidak mendukung video.
        </video>
      </div>
    </section>
    <!-- Start of Footer -->
    <footer>
      <div class="footer address">
        <i class="fa-solid fa-location-dot"></i>
        <span
          >Metro Indah Mall, Jl. Soekarno Hatta No.590, Metro Indah Mall,
          Bandung</span
        >
      </div>
      <div class="footer social-media">
        <ul>
          <li>
            <a href="#" id="whatsappLink"
              ><i class="icon-social-media fab fa-whatsapp"></i
            ></a>
          </li>
          <li>
            <a href="https://www.linkedin.com/company/moemtaz-grup/"
              ><i class="icon-social-media fab fa-linkedin"></i
            ></a>
          </li>
          <li>
            <a href="https://www.instagram.com/moemtazgroup/"
              ><i class="icon-social-media fab fa-instagram"></i
            ></a>
          </li>
          <li>
            <a
              href="mailto:info@moemtaz.com"
              aria-label="Email"
              class="hover:text-blue-400 transition"
              ><i class="fas fa-envelope"></i
            ></a>
          </li>
        </ul>
      </div>
      <div class="copyright">
        <p>Copyright &copy; 2025 ABPExMoemtaz</p>
      </div>
    </footer>
    <!-- Feather Icon -->
    <script>
      feather.replace();
    </script>
  </body>
</html>
